<script>
  (function() {
    const cards = document.querySelectorAll('.behavior-card');
    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.setAttribute('aria-checked', 'false');
          c.classList.remove('bg-mint-subtle/80');
          c.classList.add('bg-surface-container-lowest');
          
          const iconContainer = c.querySelector('.material-symbols-outlined')?.parentElement;
          if (iconContainer) {
            iconContainer.classList.remove('bg-surface-container-lowest', 'text-primary');
            iconContainer.classList.add('bg-surface-container-low', 'text-text-muted');
          }

          const check = c.querySelector('.check-icon');
          if (check) {
            check.classList.add('hidden');
            check.classList.remove('flex');
            check.classList.remove('scale-100');
            check.classList.add('scale-0');
          }
        });

        card.setAttribute('aria-checked', 'true');
        card.classList.remove('bg-surface-container-lowest');
        card.classList.add('bg-mint-subtle/80');

        const activeIconContainer = card.querySelector('.material-symbols-outlined')?.parentElement;
        if (activeIconContainer) {
          activeIconContainer.classList.remove('bg-surface-container-low', 'text-text-muted');
          activeIconContainer.classList.add('bg-surface-container-lowest', 'text-primary');
        }

        const activeCheck = card.querySelector('.check-icon');
        if (activeCheck) {
          activeCheck.classList.remove('hidden');
          activeCheck.classList.add('flex');
          setTimeout(() => {
            activeCheck.classList.remove('scale-0');
            activeCheck.classList.add('scale-100');
          }, 10);
        }
      });
    });
  })();
</script></main>
