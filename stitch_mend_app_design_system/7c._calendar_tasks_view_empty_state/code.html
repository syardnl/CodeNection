<script>
  (function() {
    const openBtn = document.getElementById('openAddTaskModal');
    const closeBtn = document.getElementById('closeAddTaskSheet');
    const cancelBtn = document.getElementById('cancelTaskBtn');
    const saveBtn = document.getElementById('saveTaskBtn');
    const sheet = document.getElementById('addTaskSheet');
    const drawer = sheet ? sheet.firstElementChild : null;
    const taskInput = document.getElementById('taskInput');

    function openModal() {
      if (!sheet || !drawer) return;
      sheet.classList.remove('pointer-events-none', 'opacity-0');
      sheet.classList.add('opacity-100');
      drawer.classList.remove('translate-y-full');
      drawer.classList.add('translate-y-0');
      setTimeout(() => { if (taskInput) taskInput.focus(); }, 180);
    }

    function closeModal() {
      if (!sheet || !drawer) return;
      drawer.classList.remove('translate-y-0');
      drawer.classList.add('translate-y-full');
      sheet.classList.remove('opacity-100');
      sheet.classList.add('opacity-0');
      setTimeout(() => {
        sheet.classList.add('pointer-events-none');
      }, 200);
    }

    if (openBtn) openBtn.addEventListener('click', openModal);
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    if (cancelBtn) cancelBtn.addEventListener('click', closeModal);

    if (saveBtn) {
      saveBtn.addEventListener('click', function() {
        const val = taskInput ? taskInput.value.trim() : '';
        if (val) {
          saveBtn.innerText = 'Added gently ✓';
          setTimeout(() => {
            closeModal();
            saveBtn.innerText = 'Save for Wednesday';
            if (taskInput) taskInput.value = '';
          }, 600);
        } else {
          closeModal();
        }
      });
    }

    // Toggle interaction demo
    const timetableBtn = document.getElementById('viewTimetableBtn');
    const tasksBtn = document.getElementById('viewTasksBtn');

    if (timetableBtn && tasksBtn) {
      timetableBtn.addEventListener('click', function() {
        timetableBtn.className = "flex-1 py-2 px-4 rounded-full bg-canvas-elevated text-on-surface shadow-[0_4px_14px_rgba(39,50,46,0.06)] flex items-center justify-center space-x-1.5 transition-all";
        tasksBtn.className = "flex-1 py-2 px-4 rounded-full text-center transition-all flex items-center justify-center space-x-1.5 text-text-muted hover:text-on-surface";
      });

      tasksBtn.addEventListener('click', function() {
        tasksBtn.className = "flex-1 py-2 px-4 rounded-full bg-canvas-elevated text-on-surface shadow-[0_4px_14px_rgba(39,50,46,0.06)] flex items-center justify-center space-x-1.5 transition-all";
        timetableBtn.className = "flex-1 py-2 px-4 rounded-full text-center transition-all flex items-center justify-center space-x-1.5 text-text-muted hover:text-on-surface";
      });
    }

    window.handlePathway = function(type) {
      if (type === 'manual') {
        openModal();
      } else {
        openModal();
        if (taskInput) {
          taskInput.placeholder = "Speak or dump your thoughts here...";
        }
      }
    };
  })();
</script></main>
