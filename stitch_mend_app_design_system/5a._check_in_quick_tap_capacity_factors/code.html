</div>
<span class="font-label-lg text-label-lg text-on-surface">Stress Pressure</span>

<span class="font-body-sm text-body-sm text-text-muted factor-status">Quiet</span>

<button class="pill-btn py-2 px-1 rounded-full bg-surface-container-low text-center font-label-sm text-label-sm text-on-surface transition-all active:scale-95" data-val="Heavy" type="button">Heavy</button>

<button class="pill-btn py-2 px-1 rounded-full bg-surface-container-low text-center font-label-sm text-label-sm text-on-surface transition-all active:scale-95" data-val="Tunnel" type="button">Tunnel</button>

<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>

<span class="material-symbols-outlined text-[14px] text-text-muted">verified_user</span>
<p class="font-label-sm text-label-sm text-text-muted">We'll confirm what was understood before anything is saved.</p>
</div>

</div>
</div>
<script>
  (function() {
    const cards = document.querySelectorAll('.factor-card');
    cards.forEach(card => {
      const buttons = card.querySelectorAll('.pill-btn');
      const statusLabel = card.querySelector('.factor-status');
      
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => {
            b.classList.remove('bg-primary-container', 'font-semibold', 'shadow-sm');
            b.classList.add('bg-surface-container-low');
          });
          btn.classList.add('bg-primary-container', 'font-semibold', 'shadow-sm');
          btn.classList.remove('bg-surface-container-low');
          if (statusLabel) {
            statusLabel.textContent = btn.getAttribute('data-val');
          }
        });
      });
    });
  })();
</script></main>
