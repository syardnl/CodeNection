<!DOCTYPE html><html class="h-full" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

"outline": "#6e7a75", "surface-container-lowest": "#ffffff", "on-error": "#ffffff", "tertiary-fixed": "#ffdcbc", "surface-container-low": "#eaf6f0", "mint-subtle": "#D5F2E7", "tertiary-container": "#ffc78d", "inverse-primary": "#7ed7bc", "on-secondary-fixed": "#002018" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1.25rem", "gutter": "1rem", "space-lg": "1.5rem", "space-xl": "2.5rem", "space-md": "1rem", "space-xs": "0.25rem", "space-sm": "0.5rem" }, fontFamily: { "headline-md": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"] }, fontSize: { "headline-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "18px", "fontWeight": "600" }], "headline-xl-mobile": ["26px", { "lineHeight": "34px", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "headline-xl": ["32px", { "lineHeight": "40px", "fontWeight": "700" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }] } } } }</script></head><body class="bg-canvas-base text-on-surface pt-safe pb-safe flex flex-col min-h-full selection:bg-mint-subtle"><main class="flex-1 flex flex-col w-full max-w-[480px] mx-auto px-margin bg-canvas-base"><div class="flex flex-col w-full pb-8 select-none">
<div class="flex flex-col items-center justify-center pt-4 pb-2">
<div class="relative flex items-center justify-center">
<div class="absolute w-36 h-36 rounded-full bg-mint-subtle/50 blur-xl"></div>
<div class="relative w-28 h-28 rounded-full flex items-center justify-center overflow-hidden transition-transform duration-500 hover:scale-105 active:scale-95" id="mascot-touch-zone">
<img alt="Mend Mascot" class="w-full h-full object-contain filter drop-shadow-sm pointer-events-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuArqFMr9c2-3WcdG4UzLGB_U6olMGILdNI9LiBR4rfhcZnM0575t_FCz6zwC3I6gqOKEiVzro_yzAZXi-f1a2JvBZ0KjyDHLX7VBUGx1hk2HTENiKbwSsT6DmNy82vHNNevTPlCoLDS89tTDPsOAapCXV7s09a86cL3eYyV4JrCGJLAj_ZlUzIJqaVOd_w_Ax373s1tyNfsyg2hm99Un3zf21sYmhj9u5gE1tXwwMAw_VJn8_h9O6g9dcsY44oEIY6B">
</div>
</div>
</div>
<div class="flex flex-col items-center text-center mt-3 mb-8">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile tracking-tight text-on-surface font-bold">
      MEND
    </h1>
<p class="font-body-md text-body-md text-text-muted mt-1">
      Less stress, more progress.
    </p>
</div>
<form class="flex flex-col w-full space-y-4" onsubmit="event.preventDefault(); handleSignIn();">
<div class="flex flex-col w-full space-y-1.5">
<label class="font-label-md text-label-md text-text-muted px-2" for="email-field">
        Email
      </label>
<div class="relative flex items-center">
<div class="absolute left-4 flex items-center justify-center pointer-events-none text-text-muted">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="w-full h-13 py-3.5 pl-12 pr-4 rounded-xl bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-text-muted/60 placeholder:font-body-md outline-none transition-all duration-200 focus:bg-canvas-elevated focus:shadow-[0_8px_20px_rgba(39,50,46,0.06)]" id="email-field" inputmode="email" placeholder="hello@university.edu" required="" type="email">
</div>
</div>
<div class="flex flex-col w-full space-y-1.5">
<div class="flex items-center justify-between px-2">
<label class="font-label-md text-label-md text-text-muted" for="password-field">
          Password
        </label>
<button class="font-label-sm text-label-sm text-text-muted hover:text-primary transition-colors focus:outline-none" type="button">
          Forgot?
        </button>
</div>
<div class="relative flex items-center">
<div class="absolute left-4 flex items-center justify-center pointer-events-none text-text-muted">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="w-full h-13 py-3.5 pl-12 pr-12 rounded-xl bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-text-muted/60 placeholder:font-body-md outline-none transition-all duration-200 focus:bg-canvas-elevated focus:shadow-[0_8px_20px_rgba(39,50,46,0.06)]" id="password-field" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3.5 flex items-center justify-center text-text-muted hover:text-on-surface transition-colors p-1" id="toggle-pwd-btn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<div class="pt-4 flex flex-col items-center w-full space-y-4">
<button class="w-full h-12 rounded-full bg-primary-container text-on-surface font-label-lg text-label-lg font-semibold flex items-center justify-center shadow-[0_8px_20px_rgba(137,226,199,0.28)] active:scale-[0.985] active:shadow-sm transition-all duration-200 cursor-pointer" id="submit-btn" type="submit">
<span id="btn-text">Sign in</span>
<span class="material-symbols-outlined text-[18px] ml-1.5 opacity-75">arrow_forward</span>
</button>
<div class="flex items-center justify-center pt-2">
<p class="font-body-sm text-body-sm text-text-muted">
          Don't have an account?
          <button class="ml-1 font-label-md text-label-md text-mint-deep font-semibold hover:underline focus:outline-none" type="button">
            Create one
          </button>
</p>
</div>
</div>
</form>
<div class="mt-12 flex flex-col items-center justify-center">
<div class="flex items-center space-x-1.5 px-4 py-2 rounded-full bg-surface-container-low/70">
<span class="material-symbols-outlined text-[15px] text-text-muted">spa</span>
<span class="font-label-sm text-label-sm text-text-muted tracking-wide">
        Take it one gentle breath at a time
      </span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const input = document.getElementById('password-field');
    const icon = document.getElementById('pwd-icon');
    if (!input || !icon) return;
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleSignIn() {
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    if (!btn || !btnText) return;

    btnText.textContent = 'Welcome back...';
    btn.classList.add('opacity-90');
    setTimeout(() => {
      btnText.textContent = 'Signed in';
    }, 800);
  }

  const mascotZone = document.getElementById('mascot-touch-zone');
  if (mascotZone) {
    mascotZone.addEventListener('click', () => {
      mascotZone.classList.add('scale-110');
      setTimeout(() => {
        mascotZone.classList.remove('scale-110');
      }, 300);
    });
  }
</script></main></body></html>
