<header class="flex items-center justify-between w-full mb-6">
<button aria-label="Go back" class="w-10 h-10 rounded-full bg-canvas-elevated flex items-center justify-center text-on-surface-variant shadow-[0_4px_16px_rgba(39,50,46,0.04)] active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>

</header>
<div class="flex flex-col items-center text-center mb-8">
<div class="relative mb-4 group cursor-pointer" id="mascot-touch-target">
<div class="absolute -inset-2 bg-gradient-to-br from-mint-subtle/40 via-mint-surface/20 to-transparent rounded-full blur-lg transform -scale-95 transition-all duration-700"></div>
<div class="relative w-[76px] h-[76px] rounded-full bg-canvas-elevated p-1 shadow-[0_12px_28px_rgba(39,50,46,0.06)] flex items-center justify-center overflow-hidden"><img alt="Mend Mascot" class="w-full h-full object-cover rounded-full transition-transform duration-300 ease-out mascot-bob select-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCTgKk_AdE4CauQsKfOh-ULTPc4apAJKVFxoMMxc3UelaclpcJ2RpI9UzfuVpZPMzN_IAw9WVDzibSeYXOKCpMZLUlJL5_68KgbG-nWRQLqMHMohK6_adTMdaLK8LTl9asapHNDrg9SxAApR9jf9yXGBn14G3z9oHHUenK1cDz1BTrlf-sO4-aG3TPyFQYiYT35OdOeK_jLh9dyeu_uCnp68l8vf0-1SH-Gfm-YlkZK4o54_pfNh2RJpNgghZLbqx5q"></div>
<div class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-mint-surface text-mint-deep font-label-sm text-label-sm px-2.5 py-0.5 rounded-full shadow-sm whitespace-nowrap transition-all duration-300 pointer-events-none opacity-0 scale-90" id="mascot-speech">take your time 🌿</div>
</div>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight mb-2">
      Start fresh with MEND
    </h1>
<p class="font-body-md text-body-md text-text-muted max-w-[280px]">
      A gentle space to pace your days and protect your energy.
    </p>
</div>
<form class="flex flex-col gap-4 w-full" id="signup-form" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-md text-label-md text-on-surface-variant ml-3 flex items-center gap-1.5" for="preferred-name">
<span class="">Preferred name</span>
<span class="text-text-muted font-body-sm text-body-sm">(or nickname)</span>
</label>
<div class="relative rounded-2xl bg-canvas-elevated shadow-[0_8px_24px_rgba(39,50,46,0.03)] transition-all duration-200 focus-within:shadow-[0_10px_28px_rgba(0,107,87,0.08)]">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
<span class="material-symbols-outlined text-[20px]">face</span>
</div>
<input autocomplete="given-name" class="w-full h-14 pl-12 pr-4 bg-transparent font-body-lg text-body-lg text-on-surface placeholder:text-text-muted/60 focus:outline-none rounded-2xl" id="preferred-name" name="name" placeholder="What should we call you?" type="text">
</div>
</div>
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-md text-label-md text-on-surface-variant ml-3" for="email">
        Email address
      </label>
<div class="relative rounded-2xl bg-canvas-elevated shadow-[0_8px_24px_rgba(39,50,46,0.03)] transition-all duration-200 focus-within:shadow-[0_10px_28px_rgba(0,107,87,0.08)]">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
<span class="material-symbols-outlined text-[20px]">alternate_email</span>
</div>
<input autocomplete="email" class="w-full h-14 pl-12 pr-4 bg-transparent font-body-lg text-body-lg text-on-surface placeholder:text-text-muted/60 focus:outline-none rounded-2xl" id="email" name="email" placeholder="name@domain.com" type="email">
</div>
</div>
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-md text-label-md text-on-surface-variant ml-3" for="password">
        Create password
      </label>
<div class="relative rounded-2xl bg-canvas-elevated shadow-[0_8px_24px_rgba(39,50,46,0.03)] transition-all duration-200 focus-within:shadow-[0_10px_28px_rgba(0,107,87,0.08)]">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="new-password" class="w-full h-14 pl-12 pr-12 bg-transparent font-body-lg text-body-lg text-on-surface placeholder:text-text-muted/60 focus:outline-none rounded-2xl" id="password" name="password" placeholder="At least 8 gentle characters" type="password">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-4 flex items-center text-text-muted hover:text-on-surface focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-visibility-icon">visibility_off</span>
</button>
</div>
</div>

<div class="flex flex-col gap-3 mt-4">
<button class="w-full h-12 rounded-full bg-primary-container text-on-primary-fixed font-label-lg text-label-lg shadow-[0_8px_20px_rgba(137,226,199,0.35)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
<span class="">Create account</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<a class="w-full py-2 text-center text-mint-deep font-label-md text-label-md transition-opacity hover:opacity-80 active:opacity-60 flex items-center justify-center gap-1.5" href="#signin">
<span class="text-text-muted">Already with us?</span>
<span class="font-semibold underline underline-offset-4 decoration-primary-container">Sign in</span>
</a>
</div>
</form>
</div>
<script>
  (function () {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password');
    const visibilityIcon = document.getElementById('password-visibility-icon');

    if (toggleBtn && passwordInput && visibilityIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        visibilityIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
      });
    }

    const mascotTarget = document.getElementById('mascot-touch-target');
    const mascotSpeech = document.getElementById('mascot-speech');
    const mascotImg = mascotTarget ? mascotTarget.querySelector('img') : null;

    if (mascotTarget && mascotSpeech && mascotImg) {
      const phrases = [
        "take your time 🌿",
        "glad you're here ✨",
        "soft steps today ☁️",
        "no rush at all 🍵"
      ];
      let phraseIndex = 0;

      const triggerGreeting = () => {
        mascotImg.style.transform = 'scale(1.1) rotate(4deg)';
        mascotSpeech.textContent = phrases[phraseIndex % phrases.length];
        phraseIndex++;
        mascotSpeech.classList.remove('opacity-0', 'scale-90');
        mascotSpeech.classList.add('opacity-100', 'scale-100');

        setTimeout(() => {
          mascotImg.style.transform = 'scale(1) rotate(0deg)';
        }, 220);

        setTimeout(() => {
          mascotSpeech.classList.remove('opacity-100', 'scale-100');
          mascotSpeech.classList.add('opacity-0', 'scale-90');
        }, 2400);
      };

      mascotTarget.addEventListener('click', triggerGreeting);
    }
  })();
</script></main>



</body></html>
