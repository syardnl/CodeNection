<script>
  (function() {
    const priorityPills = document.querySelectorAll('.priority-pill');
    priorityPills.forEach(pill => {
      pill.addEventListener('click', () => {
        priorityPills.forEach(p => {
          p.removeAttribute('data-active');
          p.classList.remove('bg-primary-container/30', 'shadow-[0_2px_12px_rgba(137,226,199,0.2)]');
          p.classList.add('bg-mint-surface');
          const icon = p.querySelector('.check-icon');
          if (icon) icon.classList.add('opacity-0');
        });
        pill.setAttribute('data-active', 'true');
        pill.classList.remove('bg-mint-surface');
        pill.classList.add('bg-primary-container/30', 'shadow-[0_2px_12px_rgba(137,226,199,0.2)]');
        const icon = pill.querySelector('.check-icon');
        if (icon) icon.classList.remove('opacity-0');
      });
    });

    const durationBtns = document.querySelectorAll('.duration-btn');
    const durationIndicator = document.getElementById('duration-indicator');
    durationBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        durationBtns.forEach(b => {
          b.classList.remove('bg-primary-container', 'text-on-primary-container', 'font-label-lg', 'shadow-sm');
          b.classList.add('bg-mint-surface', 'text-text-muted', 'font-label-md');
          b.removeAttribute('data-active');
        });
        btn.classList.remove('bg-mint-surface', 'text-text-muted', 'font-label-md');
        btn.classList.add('bg-primary-container', 'text-on-primary-container', 'font-label-lg', 'shadow-sm');
        btn.setAttribute('data-active', 'true');
        const timeVal = btn.getAttribute('data-time');
        if (durationIndicator) {
          durationIndicator.textContent = timeVal === '15m' ? '15 minutes' : 
            timeVal === '30m' ? '30 minutes' : 
            timeVal === '45m' ? '45 minutes' : 
            timeVal === '1h' ? '1 hour' : '2+ hours';
        }
      });
    });

    const typePills = document.querySelectorAll('.type-pill');
    typePills.forEach(pill => {
      pill.addEventListener('click', () => {
        typePills.forEach(t => {
          t.setAttribute('data-selected', 'false');
          t.classList.remove('bg-secondary-container/40', 'text-on-secondary-container', 'shadow-[0_2px_8px_rgba(137,226,199,0.2)]');
          t.classList.add('bg-mint-surface', 'text-on-surface');
          const title = t.querySelector('span:last-child');
          if (title) {
            title.classList.remove('font-label-lg');
            title.classList.add('font-label-md');
          }
        });
        pill.setAttribute('data-selected', 'true');
        pill.classList.remove('bg-mint-surface', 'text-on-surface');
        pill.classList.add('bg-secondary-container/40', 'text-on-secondary-container', 'shadow-[0_2px_8px_rgba(137,226,199,0.2)]');
        const title = pill.querySelector('span:last-child');
        if (title) {
          title.classList.remove('font-label-md');
          title.classList.add('font-label-lg');
        }
      });
    });
  })();
